# Render blueprint: New > Blueprint > pick this repo.
# Starts in offline demo mode. For live calls set DEMO_MODE=0, BOLNA_API_KEY, BOLNA_AGENT_ID and
# PUBLIC_BASE_URL (this service's https URL), then run `python scripts/create_agent.py --update`.
# Free-tier disks are wiped on redeploy: fine for a demo, attach a disk for persistence.
services:
  - type: web
    name: smriti
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: APP_ENV
        value: production
      - key: DEMO_MODE
        value: "1"
      - key: SECRET_SALT
        generateValue: true
      - key: ADMIN_REVIEW_TOKEN
        generateValue: true
      - key: BOLNA_WEBHOOK_TOKEN
        generateValue: true
      - key: PUBLIC_BASE_URL
        sync: false
      - key: BOLNA_API_KEY
        sync: false
      - key: BOLNA_AGENT_ID
        sync: false
      - key: BOLNA_FROM_NUMBER
        sync: false
      - key: HELPLINE_TEXT
        sync: false
      - key: MAX_CALLS_PER_IP_PER_DAY
        value: "3"
      - key: MAX_CALL_MINUTES
        value: "8"
